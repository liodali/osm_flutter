name: flutter_osm_android_jni
description: Optional JNI command transport for flutter_osm_plugin on Android.
version: 0.2.0
homepage: https://github.com/liodali/osm_flutter

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Compatible release dependencies for flutter_osm_plugin 3.0.0.
  flutter_osm_interface: ^1.7.0
  # Endorsed host package that supplies the platform view and Kotlin bridge.
  flutter_osm_android: ^0.2.0
  jni: ^1.0.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  jnigen: ^0.17.0
