name: publish_flutter_osm_android_first

# One-time first publish of the brand-new `flutter_osm_android` package.
#
# pub.dev OIDC (automated) publishing can only be enabled on a package that
# already exists, so the first upload is authenticated with the publisher's
# local pub credentials (`~/.pub-cache/credentials.json`) stored in the
# `PUB_CREDENTIALS` repository secret.
#
# AFTER the first publish succeeds:
#   1. Delete this workflow file.
#   2. Enable automated (OIDC) publishing for flutter_osm_android on pub.dev
#      (package admin → Publishing → add trusted GitHub publisher).
#   3. Future android releases go through `build_packages.yaml` by pushing a
#      `flutter_osm_android-vX.Y.Z` tag.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: britannio/action-install-flutter@v1
      - name: Switch android deps to hosted constraints
        run: python3 update_versions.py --mode android
      - name: Restore pub credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p ~/.pub-cache
          printf '%s' "$PUB_CREDENTIALS" > ~/.pub-cache/credentials.json
          chmod 600 ~/.pub-cache/credentials.json
      - name: Publish
        run: flutter pub publish -f
        working-directory: flutter_osm_android
